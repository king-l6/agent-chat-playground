# 内网入口反代模板。可选 —— 直接暴露 app 容器的 8790 也能用。
#
# 什么时候需要它：
#   - 要挂 https（Cookie 的 Secure 属性才有意义，配 PLAYGROUND_COOKIE_SECURE=1）
#   - 要统一入口/域名，或者要按来源 IP 限制只有办公网能进
# 什么时候不需要：团队几个人、内网直达，那就别加这一跳。
#
# 用法：改 server_name 和 upstream 地址，丢进 /etc/nginx/conf.d/，reload。

upstream playground_app {
  # compose 里 app 发布到宿主的 8790。nginx 和 docker 同机就是这样；
  # 不同机改成 <内网地址>:8790。
  server 127.0.0.1:8790;
  keepalive 16;
}

server {
  listen 80;
  server_name playground.internal.example;

  # 只允许内网网段访问。按实际情况改——这是除令牌之外最省事的一道门。
  # allow 10.0.0.0/8;
  # allow 172.16.0.0/12;
  # allow 192.168.0.0/16;
  # deny all;

  # 上传/正文上限。后端 express.json 的 limit 是 8mb（PUT /api/sessions/:id 会传整条会话），
  # nginx 默认 1m 会先一步 413。
  client_max_body_size 16m;

  location / {
    proxy_pass http://playground_app;
    proxy_http_version 1.1;

    # 关键：这个后端有两条 SSE 长连接（/api/chat、/api/delivery/turn，
    # 交付回合跨 await 跑几分钟）。默认 proxy_buffering on 会把 SSE 攒在缓冲区里，
    # 前端表现为「点了没反应，最后一次性刷出来」；proxy_read_timeout 默认 60s 则会中途掐断。
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 身份中间件读 req.ip 做登录限流，而 app 容器看到的是 nginx 的地址，
    # 所以要透传真实来源。后端只在 PLAYGROUND_TRUST_PROXY=1 时才认这些头
    # （否则任何人都能伪造 X-Forwarded-For 绕过限流）。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

